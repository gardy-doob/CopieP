<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CopieP</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="panel">
    <header class="top" data-tauri-drag-region>
      <h1 data-tauri-drag-region>Presse-papiers</h1>
      <button class="text-btn" id="clear" type="button" title="Supprimer tout sauf les éléments épinglés">Tout effacer</button>
    </header>

    <div class="search">
      <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5"/><path d="M13 13l4.5 4.5"/></svg>
      <input id="search" type="search" placeholder="Rechercher" autocomplete="off" spellcheck="false">
    </div>

    <div class="banner" id="banner" hidden>
      <span>Pour coller automatiquement, autorisez CopieP dans <b>Accessibilité</b>.</span>
      <button class="small-btn" id="allow" type="button">Autoriser</button>
    </div>

    <main class="list" id="list" tabindex="-1"></main>

    <div class="empty" id="empty" hidden>
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <rect x="14" y="12" width="36" height="44" rx="6"/>
        <rect x="24" y="7" width="16" height="10" rx="3"/>
        <circle cx="26" cy="33" r="1.6" class="fill"/>
        <circle cx="38" cy="33" r="1.6" class="fill"/>
        <path d="M25 41c3.5 4 10.5 4 14 0"/>
      </svg>
      <h2 id="empty-title">Votre presse-papiers est vide</h2>
      <p id="empty-text">Copiez du texte ou une image : l’historique apparaîtra ici.</p>
    </div>

    <footer class="tip" id="tip">⌥V ouvre ce panneau · double-clic pour coller</footer>
  </div>

  <div class="toast" id="toast" hidden></div>

  <template id="icons">
    <svg data-icon="pin" viewBox="0 0 20 20"><path d="M7.5 2.5h5l-.8 5 3 3.2v1.3H5.3v-1.3l3-3.2z"/><path d="M10 12v5.5"/></svg>
    <svg data-icon="finger" viewBox="0 0 20 20"><path d="M5.2 6.2A6 6 0 0 1 16 9.5c0 1.5-.2 3-.6 4.3"/><path d="M4 9.5c0-.7.1-1.3.3-1.9"/><path d="M7 15.8c.6-1.8.9-3.9.9-6.3a2.1 2.1 0 0 1 4.2 0c0 2.7-.4 5.2-1.2 7.4"/><path d="M4.4 13.4c.5-1.2.7-2.5.7-3.9a4.9 4.9 0 0 1 9.8 0"/><path d="M10 9.5c0 3.1-.5 5.9-1.5 8"/><path d="M13.6 15.6c-.2.7-.4 1.3-.7 1.9"/></svg>
    <svg data-icon="trash" viewBox="0 0 20 20"><path d="M3.5 5.5h13"/><path d="M8 5.5V3.8h4v1.7"/><path d="M5 5.5l.8 11h8.4l.8-11"/></svg>
    <svg data-icon="lock" viewBox="0 0 20 20"><rect x="4" y="9" width="12" height="8.5" rx="2"/><path d="M6.8 9V6.5a3.2 3.2 0 0 1 6.4 0V9"/></svg>
  </template>

  <script src="main.js"></script>
</body>
</html>
