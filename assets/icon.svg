<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5AA9FF"/>
      <stop offset="1" stop-color="#2F6BFF"/>
    </linearGradient>
    <linearGradient id="sheetBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#E6EEFF" stop-opacity="0.65"/>
    </linearGradient>
    <linearGradient id="sheetFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EEF3FB"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0B2A7A" flood-opacity="0.35"/>
    </filter>
    <filter id="iconShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- macOS squircle -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#iconShadow)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="4"/>
  <!-- back sheet -->
  <rect x="272" y="230" width="380" height="480" rx="56" fill="url(#sheetBack)" filter="url(#shadow)"/>
  <!-- front sheet -->
  <rect x="372" y="314" width="380" height="480" rx="56" fill="url(#sheetFront)" filter="url(#shadow)"/>
  <!-- lines -->
  <g stroke="#2F6BFF" stroke-width="34" stroke-linecap="round">
    <line x1="462" y1="470" x2="662" y2="470"/>
    <line x1="462" y1="554" x2="662" y2="554"/>
    <line x1="462" y1="638" x2="590" y2="638"/>
  </g>
</svg>
